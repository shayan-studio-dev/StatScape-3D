<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دنیای آماری</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Tahoma,sans-serif}
#ui{position:absolute;top:15px;left:50%;transform:translateX(-50%);display:flex;z-index:10;background:rgba(15,15,20,.85);padding:10px;border-radius:12px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);width:92%;max-width:400px}
button{padding:12px 15px;border-radius:8px;border:none;cursor:pointer;background:#0a84ff;color:#fff;font-weight:bold;width:100%;font-size:14px}
button.rec{background:#ef4444}
#status{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.6);padding:5px 15px;border-radius:20px;font-size:13px;z-index:10;display:none}
</style>
</head>
<body>
<div id="ui"><button id="rec" class="rec">ضبط ویدیو</button></div>
<div id="status"></div>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
let scene,camera,renderer,controls,worldGroup,isRec=false,mediaRecorder,chunks=[];
const statusEl=document.getElementById('status');
const q=new URLSearchParams(window.location.search).get('q')||'nature';
const Models={
Tree:()=>{const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.5,.8,6,6),new THREE.MeshStandardMaterial({color:0x4a3018}));t.position.y=3;t.castShadow=true;g.add(t);for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(3.5-i,6,7),new THREE.MeshStandardMaterial({color:0x1e5631,roughness:.8}));c.position.y=6+i*2.8;c.castShadow=true;g.add(c)}return g},
House:(s,c)=>{const g=new THREE.Group();const wallColors=[0xd0d0d0,0xe0e0e0,0xf5f5dc,0xa9a9a9];const roofColors=[0x8b0000,0x2c3e50,0x5c4033,0x808080];const b=new THREE.Mesh(new THREE.BoxGeometry(6,10,6),new THREE.MeshStandardMaterial({color:wallColors[c%4]}));b.position.y=5*s;b.scale.y=s;b.castShadow=b.receiveShadow=true;g.add(b);const r=new THREE.Mesh(new THREE.ConeGeometry(5.5,4,4),new THREE.MeshStandardMaterial({color:roofColors[c%4]}));r.position.y=(10*s)+2;r.rotation.y=Math.PI/4;r.castShadow=true;g.add(r);return g},
Mountain:()=>{const g=new THREE.Group(),h=45+Math.random()*20,r=30+Math.random()*10;const b=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),new THREE.MeshStandardMaterial({color:0x4a5d23,roughness:.9,flatShading:true}));b.position.y=h/2;b.castShadow=true;b.receiveShadow=true;g.add(b);const s=new THREE.Mesh(new THREE.ConeGeometry(r*0.35,h*0.35,7),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4}));s.position.y=h-(h*0.17);s.castShadow=true;g.add(s);return g},
Car:()=>{const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(6,1.5,3),new THREE.MeshStandardMaterial({color:0x2980b9,metalness:.6}));b.position.y=1.5;b.castShadow=true;g.add(b);const c=new THREE.Mesh(new THREE.BoxGeometry(3,1.5,2.6),new THREE.MeshStandardMaterial({color:0x111111,metalness:.8}));c.position.set(-.5,3,0);c.castShadow=true;g.add(c);const wG=new THREE.CylinderGeometry(.8,.8,.6,12),wM=new THREE.MeshStandardMaterial({color:0x222222});[[-1.8,.8,1.5],[1.8,.8,1.5],[-1.8,.8,-1.5],[1.8,.8,-1.5]].forEach(p=>{const w=new THREE.Mesh(wG,wM);w.rotation.x=Math.PI/2;w.position.set(...p);w.castShadow=true;g.add(w)});return g}
};
function init(){
scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,.1,2000);camera.position.set(120,100,120);
renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.5;controls.maxPolarAngle=Math.PI/2-.05;controls.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,.8));const dl=new THREE.DirectionalLight(0xfff5e6,2.0);dl.position.set(80,150,80);dl.castShadow=true;dl.shadow.mapSize.width=2048;dl.shadow.mapSize.height=2048;scene.add(dl);
worldGroup=new THREE.Group();scene.add(worldGroup);window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();buildWorld()}

async function buildWorld(){
let sceneData=null;
if (typeof bakedData !== 'undefined') { 
    sceneData = bakedData; 
} else {
    try {
        const res=await fetch('api.php?q='+encodeURIComponent(q));
        sceneData=await res.json();
    } catch(e) {
        sceneData = { time: 'day', gridSize: 40, terrain: Array(41*41).fill(0), objects: [] };
    }
}

if (!sceneData || !sceneData.objects) return;

const isNight=sceneData.time==='night';
scene.background=new THREE.Color(isNight?0x0a0a2a:0x87ceeb);scene.fog=new THREE.FogExp2(scene.background,.003);
const groundGeo=new THREE.PlaneGeometry(300,300,sceneData.gridSize,sceneData.gridSize);const pos=groundGeo.attributes.position;
for(let i=0;i<pos.count;i++){pos.setZ(i,sceneData.terrain[i])}groundGeo.computeVertexNormals();
const ground=new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({color:isNight?0x1a3a1a:0x4caf50,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;worldGroup.add(ground);
sceneData.objects.forEach(obj=>{let mesh;if(obj.type==='tree')mesh=Models.Tree();else if(obj.type==='house')mesh=Models.House(obj.scale,obj.color);else if(obj.type==='mountain')mesh=Models.Mountain();else if(obj.type==='car')mesh=Models.Car();
if(mesh){mesh.position.set(obj.x,0,obj.z);if(obj.type!=='house'&&obj.type!=='car'){mesh.rotation.y=obj.rot;mesh.scale.set(obj.scale,obj.scale,obj.scale)}else if(obj.type==='car'){mesh.rotation.y=obj.rot}worldGroup.add(mesh)}})}
function startRec(){if(isRec)return;const s=renderer.domElement.captureStream(60);mediaRecorder=new MediaRecorder(s,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8000000});chunks=[];mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='world-'+Date.now()+'.webm';a.click();isRec=false;document.getElementById('rec').textContent='ضبط ویدیو';document.getElementById('rec').style.background='#ef4444';statusEl.style.display='none'};mediaRecorder.start();isRec=true;document.getElementById('rec').textContent='توقف و ذخیره';document.getElementById('rec').style.background='#333';statusEl.textContent='در حال ضبط...';statusEl.style.display='block'}
document.getElementById('rec').onclick=()=>isRec?mediaRecorder.stop():startRec();init();
</script>
</body>
</html>
